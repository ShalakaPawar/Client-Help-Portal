# Local infrastructure for the Client Help Portal.
# Generated config files (docker/livekit.yaml, docker/egress.yaml) are created by `npm run setup`.
name: client-help-portal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Media server (SFU). Browsers on this machine connect to ws://localhost:7880.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # Recorder. Shares LiveKit's network namespace so 127.0.0.1 ICE candidates work.
  egress:
    image: livekit/egress:v1.15.0
    network_mode: "service:livekit"
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./docker/egress.yaml:/etc/egress.yaml:ro
      # The parent folder, not data/recordings itself: if data/recordings is deleted and recreated,
      # a direct mount would keep pointing at the deleted folder and every recording would fail.
      - ./data:/data
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    depends_on:
      - livekit

volumes:
  pgdata:
  redisdata:
